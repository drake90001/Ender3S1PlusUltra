[gcode_macro SENSORLESS_HOME_X]
gcode:
    {% set HOME_CUR_X = 0.500 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}
    {% set RUN_CUR_X = driver_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR_X}
    G4 P2000
    G28 X0
    G90
    G1 X5 F1200
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}

[gcode_macro SENSORLESS_HOME_Y]
gcode:
    {% set HOME_CUR_Y = 0.500 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_y'] %}
    {% set RUN_CUR_Y = driver_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR_Y}
    G4 P2000
    G28 Y0
    G90
    G1 Y5 F1200
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}

[homing_override]
set_position_z: 0
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set HOME_CUR_X = 0.500 %}
  {% set HOME_CUR_Y = 0.500 %}
  {% set RUN_CUR_X = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
  {% set RUN_CUR_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}

  # Always lift Z slightly relative to current position before X/Y moves
  G91
  G1 Z5 F600
  G90

  # Home X axis if requested or if homing all
  {% if home_all or 'X' in params %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR_X}
    G4 P2000
    G28 X0
    G90
    G1 X117.5 F1200
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
  {% endif %}

  # Home Y axis if requested or if homing all
  {% if home_all or 'Y' in params %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR_Y}
    G4 P2000
    G28 Y0
    G90
    G1 Y117.5 F1200
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
  {% endif %}

  # Home Z axis (probe at center of bed) if requested or if homing all
  {% if home_all or 'Z' in params %}
    G90
    G1 X117.5 Y117.5 F3000   # Center toolhead before Z probing
    G28 Z0
    G1 Z10 F600              # Lift Z after homing
  {% endif %}