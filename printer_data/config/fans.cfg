[heater_fan heatbreak_cooling_fan]
pin: PE5
heater: extruder
heater_temp: 45.0

[fan]
pin: PA8

[fan_generic auxiliary_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.0010
hardware_pwm: True
kick_start_time: 0.100
off_below: 0.0

[controller_fan driver_fan]
pin: PD13
max_power: 1.0
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z, extruder
idle_timeout: 30